<!doctype html><html><head><meta charset="utf-8"><title>Icon</title>
<style>
:root{--brand:#6d28d9;--lilac:#c4b5fd;--night:#17112e}
html,body{margin:0;padding:0;background:var(--night)}
.icon{width:256px;height:256px;position:relative;overflow:hidden;background:var(--night)}
.glow{position:absolute;left:-40px;top:-60px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(109,40,217,.7),rgba(109,40,217,0) 62%)}
/* The order: a receipt with its lines, slightly tilted like the banner cards. */
.order{position:absolute;left:58px;top:38px;width:128px;height:166px;background:#fff;border-radius:14px;transform:rotate(-6deg);box-shadow:0 14px 30px rgba(0,0,0,.45);padding:20px 18px;box-sizing:border-box;display:grid;align-content:start;gap:13px}
.line{height:11px;border-radius:6px;background:#ddd6fe}
.line.head{height:14px;width:62%;background:var(--brand)}
.line.short{width:70%}
.total{margin-top:6px;display:flex;justify-content:space-between;gap:10px}
.total span{height:13px;border-radius:6px;background:#ddd6fe;flex:1}
.total span:last-child{background:var(--brand);flex:.7}
/* The "add" badge. */
.add{position:absolute;right:34px;bottom:30px;width:86px;height:86px;border-radius:50%;background:var(--brand);border:7px solid var(--night);box-sizing:border-box;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.add svg{width:40px;height:40px}
</style></head><body>
<div class="icon">
  <div class="glow"></div>
  <div class="order">
    <div class="line head"></div>
    <div class="line"></div>
    <div class="line short"></div>
    <div class="line"></div>
    <div class="total"><span></span><span></span></div>
  </div>
  <div class="add"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></div>
</div>
</body></html>
