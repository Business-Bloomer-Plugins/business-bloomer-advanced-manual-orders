<!doctype html><html><head><meta charset="utf-8"><title>Banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--brand:#6d28d9;--lilac:#c4b5fd;--night:#17112e;--display:"Hanken Grotesk",Arial,sans-serif;--mono:"IBM Plex Mono",monospace}
html,body{margin:0;padding:0;background:var(--night)}
.banner{container-type:inline-size;width:var(--w,772px);aspect-ratio:772/250;position:relative;overflow:hidden;background:var(--night);color:#fff;font-family:var(--display)}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(109,40,217,.55),rgba(109,40,217,0) 65%)}
.brand{font-size:1.75cqw;font-weight:700;letter-spacing:.01em;color:#cfc8e6;margin-bottom:0.9cqw}
.eyebrow{font-family:var(--mono);font-size:1.55cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac);margin-top:1cqw}
.name{font-size:4.8cqw;line-height:1.02;font-weight:800;letter-spacing:-.02em}
.name span{color:var(--lilac)}
.sub{font-size:1.85cqw;margin-top:2cqw;line-height:1.35;color:#cfc8e6}
.sub .hl{color:#fff;font-weight:700;white-space:nowrap}
.in{position:absolute;inset:0;display:grid;grid-template-columns:1fr 52cqw;gap:3.5cqw;align-items:center;padding:0 3.6cqw 0 5.5cqw}
.in>div:first-child{transform:translateY(0.6cqw)}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:1cqw .6cqw}
.card{border:.13cqw solid rgba(196,181,253,.22);border-radius:1cqw;display:grid;align-content:center;min-width:0;padding:1.2cqw 1.6cqw;gap:.8cqw;background:#231b45;box-shadow:0 1.2cqw 2.8cqw rgba(0,0,0,.5);position:relative}
.k{font-family:var(--mono);font-size:1.3cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.field{display:flex;align-items:center;gap:.7cqw;background:#fff;color:#3b3554;border-radius:.5cqw;padding:.8cqw 1cqw;font-size:1.55cqw;font-weight:600}
.field svg{width:1.6cqw;height:1.6cqw;flex:none}
.opt{display:flex;justify-content:space-between;font-size:1.5cqw;padding:.7cqw 1cqw;border-radius:.5cqw;background:var(--brand);font-weight:600}
.opt i{font-style:normal;font-family:var(--mono);font-size:1.35cqw;opacity:.85}
.chips{display:flex;gap:.6cqw;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:1.5cqw;padding:.6cqw .9cqw;border-radius:.6cqw;border:.13cqw solid rgba(196,181,253,.35);color:#e9e3ff}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.radio{display:flex;align-items:center;gap:.7cqw;font-size:1.45cqw;color:#e9e3ff}
.radio::before{content:"";width:1.4cqw;height:1.4cqw;border-radius:50%;border:.15cqw solid var(--lilac);flex:none;box-sizing:border-box}
.radio.on::before{background:var(--brand);box-shadow:inset 0 0 0 .25cqw var(--night);border-color:var(--brand)}
.dup{display:flex;align-items:center;gap:.7cqw}
.btn{display:inline-flex;align-items:center;gap:.6cqw;font-size:1.55cqw;font-weight:700;padding:.75cqw 1.1cqw;border-radius:.5cqw;background:var(--brand);color:#fff}
.btn svg{width:1.55cqw;height:1.55cqw}
.arrow{font-family:var(--mono);font-size:1.25cqw;color:#cfc8e6;white-space:nowrap}
.rate{display:flex;justify-content:space-between;align-items:center;font-size:1.45cqw;gap:1.4cqw;color:#e9e3ff}
.rate b{font-family:var(--mono);font-weight:500}
.t1{transform:rotate(-5deg) translate(.6cqw,.2cqw);z-index:3}
.t2{transform:rotate(4deg) translate(-.2cqw,-.4cqw);z-index:2}
.t3{transform:rotate(3deg) translate(.6cqw,.4cqw);z-index:1}
.t4{transform:rotate(-3.5deg) translate(-.4cqw,-.2cqw);z-index:4}
</style></head><body>
<div class="banner">
  <div class="glow" style="right:0;top:-22cqw;width:60cqw;height:60cqw"></div>
  <div class="in">
    <div>
      <div class="brand">Business Bloomer</div>
      <div class="name">Advanced<br><span>Manual Orders</span></div>
      <div class="eyebrow">for WooCommerce</div>
      <div class="sub">Create manual orders <b class="hl">up to 90% faster</b>, with the right products, currency, shipping rates and taxes.</div>
    </div>
    <div class="grid">
      <div class="card t1"><div class="k">Add a product</div>
        <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Hoodie</div>
        <div class="opt"><span>Red, L</span><i>$45.00</i></div></div>
      <div class="card t2"><div class="k">Calculate shipping</div>
        <div class="rate"><span class="radio on">Courier</span><b>$17.00</b></div>
        <div class="rate"><span class="radio">Express</span><b>$29.00</b></div></div>
      <div class="card t3"><div class="k">Duplicate</div>
        <div class="dup"><span class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Duplicate</span><span class="arrow">#1042 → #1043</span></div></div>
      <div class="card t4"><div class="k">Currency</div>
        <div class="chips"><span class="chip on">EUR €</span><span class="chip">USD $</span><span class="chip">GBP £</span></div></div>
    </div>
  </div>
</div>
</body></html>
